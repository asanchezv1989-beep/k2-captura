<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c1917">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="K2 Captura">
  <title>K2 Captura</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <img src="icons/icon-192.png" alt="" class="logo" style="border-radius:7px">
    <div class="top-title">
      <strong id="hdr-job">K2 Captura</strong>
      <span id="hdr-sub"></span>
    </div>
    <span id="hdr-dirty" class="dirty" data-tab="send" hidden></span>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="hours"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Horas</span></button>
    <button data-tab="equip"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg><span>Equipo</span></button>
    <button data-tab="log"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Log equipo</span></button>
    <button data-tab="send"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15l3-3 3 3"/></svg><span>Enviar</span></button>
  </nav>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" class="toast" hidden></div>
  <input type="file" id="file" accept=".json,application/json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
